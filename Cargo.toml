[package]
name = "resid"
version = "0.1.0"
edition = "2024"

[dependencies]
html5ever = "0.39"
markup5ever_rcdom = "0.39"
rustybuzz = "0.20"
lopdf = "0.44"
ttf-parser = "0.25"
clap = { version = "4.6.6", features = ["derive"] }
unicode-bidi = "0.3.18"
cssparser = "0.37.0"
selectors = "0.40.0"
precomputed-hash = "0.1.1"

[profile.dev]
opt-level = 0        
debug = true        
incremental = true 

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
